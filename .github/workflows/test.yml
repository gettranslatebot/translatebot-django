name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Run Ruff linter
      run: ruff check .

    - name: Run Ruff formatter check
      run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        django-version: ["4.2", "5.0", "5.1", "5.2", "6"]
        # pytest-django 4.13 reads TestCase._pre_setup_ran_eagerly, which Django
        # only added in 5.2. It declares no Django bound, so pip cannot back off
        # on its own. Newer Django keeps testing against the current release.
        include:
          - django-version: "4.2"
            extra-pins: "pytest-django<4.13"
          - django-version: "5.0"
            extra-pins: "pytest-django<4.13"
          - django-version: "5.1"
            extra-pins: "pytest-django<4.13"
        exclude:
          # Django 6.0 requires Python 3.12+
          - python-version: "3.10"
            django-version: "6"
          - python-version: "3.11"
            django-version: "6"
          # Django 4.2 supports Python <= 3.12
          - python-version: "3.13"
            django-version: "4.2"
          - python-version: "3.14"
            django-version: "4.2"
          # Django 5.0 supports Python <= 3.12
          - python-version: "3.13"
            django-version: "5.0"
          - python-version: "3.14"
            django-version: "5.0"
          # Django 5.1 supports Python <= 3.13
          - python-version: "3.14"
            django-version: "5.1"

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    # Resolve Django and the dev extras in a single pass. Installing them as two
    # commands let the second resolution silently upgrade Django, so the 4.2 and
    # 5.0 cells were really testing 5.2 and 6.1 while reporting green.
    - name: Install dependencies
      env:
        DJANGO_SERIES: ${{ matrix.django-version }}
        EXTRA_PINS: ${{ matrix.extra-pins }}
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" "Django~=${DJANGO_SERIES}.0" ${EXTRA_PINS}

    # Belt and braces: a conflicting dependency should fail the install above,
    # never quietly swap the version under test.
    - name: Verify installed Django matches the matrix
      env:
        DJANGO_SERIES: ${{ matrix.django-version }}
      run: |
        python -c '
        import os, django
        want = os.environ["DJANGO_SERIES"]
        got = ".".join(str(p) for p in django.VERSION[:2])
        ok = got == want if "." in want else got.split(".")[0] == want
        raise SystemExit(0 if ok else f"expected Django {want}.x, got {got}")
        '

    - name: Run tests
      env:
        PYTHONPATH: .
      run: |
        pytest -v --cov=translatebot_django --cov-report=xml --cov-report=term
    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.14' && matrix.django-version == '6'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
